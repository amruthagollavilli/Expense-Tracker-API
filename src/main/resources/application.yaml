spring:
    datasource:
        url: jdbc:postgresql://localhost:5432/expense_tracker
        username: postgres
        password: My_Password
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true
        database: PostgreSQL
        database-platform: org.hibernate.dialect.PostgreSQLDialect